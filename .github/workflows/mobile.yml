name: mobile

on:
  push:
    branches: [dev]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd mobile && xcodegen generate

      - name: Build unsigned device app and IPA
        run: |
          BUILD=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          xcodebuild \
            -project mobile/VirtMan.xcodeproj \
            -scheme VirtMan \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            MARKETING_VERSION="1.0.$BUILD" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/VirtMan.app"
          test -d "$APP"
          # Build-setting expansion in Info.plist is not worth trusting; the
          # version LiveContainer compares is written here.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.$BUILD" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$APP/Info.plist"
          plutil -lint "$APP/Info.plist"
          lipo -info "$APP/VirtMan"

          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry VirtMan.ipa Payload)
          test -s out/VirtMan.ipa

      - name: Generate AltStore source
        run: |
          python3 mobile/scripts/make-source.py \
            --version "1.0.$BUILD" \
            --build "$BUILD" \
            --ipa out/VirtMan.ipa \
            --out out/altsource.json \
            --notes "Rolling build $BUILD from ${GITHUB_SHA:0:7}"
          python3 -m json.tool out/altsource.json > /dev/null

      - name: Publish rolling release
        run: |
          if ! gh release view mobile-latest >/dev/null 2>&1; then
            gh release create mobile-latest \
              --target "$GITHUB_SHA" \
              --title "VirtMan iOS (rolling)" \
              --notes "Rolling unsigned build $BUILD"
          fi
          # IPA first: the source must never point at a missing file.
          gh release upload mobile-latest out/VirtMan.ipa --clobber
          gh release upload mobile-latest out/altsource.json --clobber
          gh release edit mobile-latest --notes "Rolling unsigned build $BUILD from ${GITHUB_SHA:0:7}"
