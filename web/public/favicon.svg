<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>virt-man</title>
  <!-- A tab icon, not a logo: a shell prompt (">_"), the app's coral chevron
       with a cursor underscore, filling the box with no tile behind it. The
       underscore follows the tab's light or dark background. Edges sit on whole
       pixels at 16px (16 units each) so it stays crisp. -->
  <style>
    .u { fill: #f2f2f3; }
    @media (prefers-color-scheme: light) { .u { fill: #18181a; } }
  </style>
  <polygon fill="#fe6565" points="16,32 64,32 160,128 64,224 16,224 112,128"/>
  <rect class="u" x="144" y="192" width="96" height="32"/>
</svg>
