[package]
name = "virt-man-daemon"
version = "0.1.0"
edition = "2024"

[lib]
name = "virt_man_daemon"
path = "src/lib.rs"

[[bin]]
name = "virt-man-daemon"
path = "src/main.rs"

[dependencies]
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
# The console upgrades its connection to a raw byte pipe.
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
subtle = "2"
libc = "0.2"
# Terminal bytes travel base64d in JSON.
base64 = "0.22"
# Volume hashing, so a staged upload can be verified after transfer.
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
# Fetching an ISO from a URL straight into a pool. webpki roots, so it trusts
# the public CAs without depending on the host's certificate bundle; the
# crypto provider is the aws-lc-rs one axum-server already brings.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "stream"] }
socket2 = { version = "0.6", features = ["all"] }
uuid = { version = "1", features = ["v4"] }
# The domain XML the SPA defines is nested (devices, disk sources, addresses),
# and it is the durable definition now: a real parser, not string searches.
roxmltree = "0.21.1"

[dev-dependencies]
# `oneshot` drives the routes directly in the in-module tests.
tower = { version = "0.5", features = ["util"] }
